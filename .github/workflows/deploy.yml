# Deploy the live demo on Render when a release tag (v0.1.0, v0.2.0, ...) is
# pushed, after the tests pass. Can also be started by hand from the Actions tab.
#
# Repository setting needed (Settings > Secrets and variables > Actions > Secrets):
#   RENDER_DEPLOY_HOOK_URL  the service's deploy hook, from Render > Settings > Deploy Hook
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # ref= tells Render to deploy exactly the commit that was tested,
      # not whatever is newest on the branch.
      - name: Trigger the Render deploy
        run: curl --fail --silent --show-error -X POST "$HOOK&ref=$GITHUB_SHA"
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
