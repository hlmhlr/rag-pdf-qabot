[project]
name = "qabot"
version = "0.1.0"
description = "Ask questions about your PDFs: a RAG question-answering bot with LangChain, Chroma and Gradio, running locally on IBM Granite or deployed with Gemini."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.0",
    "langchain-chroma>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Gemini for answers and/or embeddings (the deployed demo uses only this).
gemini = ["langchain-google-genai>=4.0"]
# Granite Embedding on CPU without Ollama (brings in PyTorch, a large download).
hf = [
    "langchain-huggingface>=1.0",
    "sentence-transformers>=3.0",
]
# Both of the above.
cloud = ["qabot[gemini,hf]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qabot"]

[dependency-groups]
dev = [
    "langchain-classic>=1.0",
    "pytest>=8",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
